# Netlify — apps/admin (site admin-ticket-ar)
#
# IMPORTANTE: este archivo puede ser leído por DOS sitios según el "base
# directory" de cada uno:
#   - admin-ticket-ar (base = apps/admin): construye el ADMIN (BUILD_APP=admin)
#   - ticket-ar: si su base directory apunta a apps/admin, también lo lee
#     aquí — por eso el comando selecciona la app por variable de entorno
#     BUILD_APP, con default "api" para que producción (ticket-ar) nunca
#     deje de construir la API. El sitio admin-ticket-ar setea BUILD_APP=admin.
[build]
  # $BUILD_APP está seteado en las env vars de cada sitio (api en ticket-ar,
  # admin en admin-ticket-ar). Se usa $BUILD_APP sin sintaxis ${VAR:-default}
  # para que la expansión la haga siempre bash y nunca el parser de toml.
  #
  # El "base directory" de ticket-ar apunta a apps/admin (el deploy del
  # 04:07 construyó el admin desde este archivo), así que el plugin de Next
  # empaqueta lo que encuentre en apps/admin/.next. Si ticket-ar construye
  # la API (BUILD_APP=api), copiamos el .next de la API ahí para que el
  # plugin empaquete la API y no un .next viejo del admin.
  command = "[ -f pnpm-workspace.yaml ] || cd ../..; pnpm --filter @ticketscan/$BUILD_APP build || exit 1; if [ \"$BUILD_APP\" = api ]; then rm -rf apps/admin/.next && cp -R apps/api/.next apps/admin/.next; fi"
  publish = ".next"

# Runtime oficial de Next.js en Netlify (OpenNext).
[[plugins]]
  package = "@netlify/plugin-nextjs"

# NOTA: el proxy de /api/* al sitio de la API NO va aquí (una regla
# [[redirects]] en este archivo también se aplicaría en ticket-ar si su base
# directory apunta a apps/admin → proxy hacia sí mismo → /api/* muere en
# producción). El proxy vive en next.config.js (rewrites), que solo se
# aplica cuando se construye la app admin.
