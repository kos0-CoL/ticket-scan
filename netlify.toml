# TicketScan v2 - Netlify Configuration
# Single site deployment with admin proxy

[build]
  command = "pnpm run build"
  publish = ".netlify/output"

# Build environment variables
[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Redirects for admin panel proxy
[[redirects]]
  from = "/admin/*"
  to = "https://admin-ticket-ar.netlify.app/:splat"
  status = 200
  force = true

# API routes - handled by Next.js rewrites
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache fonts
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"